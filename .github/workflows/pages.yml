name: publish-site

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ozel veri deposunu al
        uses: actions/checkout@v4
        with:
          repository: mww872-lgtm/freetierwatch-archive
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: private
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Siteyi uret
        run: python site/build.py
        env:
          FTW_DATA_DIR: ${{ github.workspace }}/private
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

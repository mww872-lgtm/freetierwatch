name: weekly-check

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mww872-lgtm/freetierwatch-archive
          token: ${{ secrets.ARCHIVE_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Weekly run
        run: bash app/run-weekly.sh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
